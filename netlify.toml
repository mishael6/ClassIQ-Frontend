[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NPM_FLAGS = "--include=dev"
  NODE_VERSION = "20"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from   = "/api/*"
  to     = "https://api-classiq.onrender.com/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/privacy.html"
  to     = "/privacy.html"
  status = 200
  force  = true

[[redirects]]
  from   = "/payment.html"
  to     = "/payment.html"
  status = 200
  force  = true

[[plugins]]
  package = "@netlify/plugin-nextjs"
